name: Build and return signed Bullet Heaven Gacha Audition Ad Hoc IPA

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-ios-adhoc:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout infrastructure snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify private export and sign one IPA
        env:
          BHG_APPLE_P12_B64: ${{ secrets.BHG_APPLE_P12_B64 }}
          BHG_APPLE_P12_PASSWORD: ${{ secrets.BHG_APPLE_P12_PASSWORD }}
          BHG_APPLE_PROFILE_B64: ${{ secrets.BHG_APPLE_PROFILE_B64 }}
          BHG_EXPORT_SHA256: ${{ secrets.BHG_EXPORT_SHA256 }}
          BHG_EXPORT_MANIFEST_SHA256: ${{ secrets.BHG_EXPORT_MANIFEST_SHA256 }}
          BHG_EXPORT_INVENTORY_COUNT: ${{ secrets.BHG_EXPORT_INVENTORY_COUNT }}
          BHG_EXPORT_FRAMED_TREE_SHA256: ${{ secrets.BHG_EXPORT_FRAMED_TREE_SHA256 }}
          BHG_CANDIDATE_COMMIT: ${{ secrets.BHG_CANDIDATE_COMMIT }}
          BHG_CANDIDATE_TREE: ${{ secrets.BHG_CANDIDATE_TREE }}
          BHG_EXPORT_TOKEN: ${{ secrets.BHG_EXPORT_TOKEN }}
          BHG_EXPORT_URL: ${{ secrets.BHG_EXPORT_URL }}
          BHG_MANIFEST_URL: ${{ secrets.BHG_MANIFEST_URL }}
        run: bash scripts/build-sign-return.sh
      - name: Upload verified IPA result
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bhg-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bhg-result-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Upload sanitized Xcode failure diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bhg-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bhg-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Always remove transient signing and payload material
        if: ${{ always() }}
        run: bash scripts/cleanup.sh
