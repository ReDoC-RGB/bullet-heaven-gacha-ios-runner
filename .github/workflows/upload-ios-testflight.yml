name: Build and upload Rivetkind to TestFlight

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-upload-testflight:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout infrastructure snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify export, sign, and upload to TestFlight
        env:
          RIVETKIND_APPLE_P12_B64: ${{ secrets.RIVETKIND_APPLE_P12_B64 }}
          RIVETKIND_APPLE_P12_PASSWORD: ${{ secrets.RIVETKIND_APPLE_P12_PASSWORD }}
          RIVETKIND_APPLE_PROFILE_B64: ${{ secrets.RIVETKIND_APPLE_PROFILE_B64 }}
          RIVETKIND_ASC_KEY_ID: ${{ secrets.RIVETKIND_ASC_KEY_ID }}
          RIVETKIND_ASC_ISSUER_ID: ${{ secrets.RIVETKIND_ASC_ISSUER_ID }}
          RIVETKIND_ASC_PRIVATE_KEY_B64: ${{ secrets.RIVETKIND_ASC_PRIVATE_KEY_B64 }}
          BHG_EXPORT_SHA256: ${{ secrets.BHG_EXPORT_SHA256 }}
          BHG_EXPORT_MANIFEST_SHA256: ${{ secrets.BHG_EXPORT_MANIFEST_SHA256 }}
          BHG_EXPORT_INVENTORY_COUNT: ${{ secrets.BHG_EXPORT_INVENTORY_COUNT }}
          BHG_EXPORT_FRAMED_TREE_SHA256: ${{ secrets.BHG_EXPORT_FRAMED_TREE_SHA256 }}
          BHG_CANDIDATE_COMMIT: ${{ secrets.BHG_CANDIDATE_COMMIT }}
          BHG_CANDIDATE_TREE: ${{ secrets.BHG_CANDIDATE_TREE }}
          BHG_EXPORT_TOKEN: ${{ secrets.BHG_EXPORT_TOKEN }}
          BHG_EXPORT_URL: ${{ secrets.BHG_EXPORT_URL }}
          BHG_MANIFEST_URL: ${{ secrets.BHG_MANIFEST_URL }}
        run: bash scripts/build-upload-testflight.sh
      - name: Upload sanitized TestFlight receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rivetkind-testflight-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rivetkind-testflight-result-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Upload sanitized Xcode failure diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rivetkind-testflight-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bhg-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Always remove transient signing, API, and payload material
        if: ${{ always() }}
        run: bash scripts/cleanup-testflight.sh
